      - generic [ref=e26]:
        - heading "I have created a series of software testing tools, templates and playgrounds that are available for you to use to help support your testing." [level=2] [ref=e27]
        - paragraph
        - heading "Automation in Testing Online" [level=3] [ref=e28]
        - paragraph [ref=e29]: The site https://automationintesting.online is a free to use Web application that contains modern web technology to create a playground for you to practise a range of software testing skills. From UI and API automation to Exploratory and Accessibility testing, Automation in Testing online, offers you a safe space to practise your skills.
        - paragraph [ref=e30]:
          - link "Website" [ref=e31] [cursor=pointer]:
            - /url: https://automationintesting.online/?ref=mwtestconsultancy.co.uk
          - text: "-"
          - link "Source Code" [ref=e32] [cursor=pointer]:
            - /url: https://github.com/mwinteringham/restful-booker-platform?ref=mwtestconsultancy.co.uk
        - heading "Restful-booker" [level=3] [ref=e33]
        - paragraph [ref=e34]: The web service deployed to https://restful-booker.herokuapp.com is a demo Web service that you can practise API testing and automation against. The web service contains multiple different method types and actions to practise with, all supported by in depth documentation for the API. It also comes with a series of bugs for you to find. Can you find the teapot?
        - paragraph [ref=e35]:
          - link "Website" [ref=e36] [cursor=pointer]:
            - /url: https://restful-booker.herokuapp.com/?ref=mwtestconsultancy.co.uk
          - text: "-"
          - link "Source Code" [ref=e37] [cursor=pointer]:
            - /url: https://github.com/mwinteringham/restful-booker?ref=mwtestconsultancy.co.uk
        - heading "Api Framework" [level=3] [ref=e38]
        - paragraph [ref=e39]: The api-framework repository demonstrates a pattern to develop automated API checks using different languages and libraries to help you get started with automated API checking. There are runnable API checks that work against restful-booker app.
        - paragraph [ref=e40]:
          - link "Source code" [ref=e41] [cursor=pointer]:
            - /url: https://github.com/mwinteringham/api-framework?ref=mwtestconsultancy.co.uk
