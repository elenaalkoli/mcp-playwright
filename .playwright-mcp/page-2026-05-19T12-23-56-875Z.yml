          - heading "When not to use AI" [level=1] [ref=e26]
          - paragraph [ref=e27]: Generative AI is a powerful tool—but only if you know when not to use it. In this post, we explore a simple model that helps you decide whether AI will boost your testing or lead you off track.
          - generic [ref=e28]:
